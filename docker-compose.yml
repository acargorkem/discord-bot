# Bot + NodeLink'i birlikte ayağa kaldırır.
# Yerel:  docker compose up --build
# VPS:    docker compose pull && docker compose up -d
#
# Değişkenler kök .env dosyasından okunur (DISCORD_TOKEN, BOT_IMAGE, NODELINK_PASSWORD ...).

services:
  nodelink:
    image: performanc/nodelink:3.8.0
    container_name: nodelink
    environment:
      NODELINK_SERVER_HOST: "0.0.0.0"
      NODELINK_SERVER_PORT: "4000"
      NODELINK_SERVER_PASSWORD: "${NODELINK_PASSWORD:-youshallnotpass}"
      NODELINK_CLUSTER_WORKERS: "1"
      NODELINK_LOGGING_LEVEL: "info"
      # YouTube OAuth — datacenter IP throttling'i aşmak için (bkz docs/YOUTUBE_OAUTH.md).
      # İlk kurulumda .env'de NODELINK_YT_OAUTH=true yapıp loglardan giriş yap,
      # çıkan refresh token'ı .env'deki NODELINK_YT_REFRESH_TOKEN'e koy, OAUTH'u false yap.
      NODELINK_SOURCES_YOUTUBE_GETOAUTHTOKEN: "${NODELINK_YT_OAUTH:-false}"
      NODELINK_SOURCES_YOUTUBE_CLIENTS_SETTINGS_TV_REFRESHTOKEN: "${NODELINK_YT_REFRESH_TOKEN:-}"
      # YouTube bu datacenter IP'sinden bloklanıyorsa komple kapatmak için
      # .env'de NODELINK_YT_ENABLED=false yap (Spotify vb. sesi soundcloud/deezer'dan çeker).
      NODELINK_SOURCES_YOUTUBE_ENABLED: "${NODELINK_YT_ENABLED:-true}"
      # Arama kaynakları — YouTube kapatılırsa buradan da çıkarılmalı, yoksa
      # NodeLink "kapalı kaynağa referans" diye başlamayı reddeder. YouTube'u
      # kapatınca .env'de NODELINK_SEARCH_SOURCES=soundcloud yap.
      NODELINK_DEFAULTSEARCHSOURCE: "${NODELINK_SEARCH_SOURCES:-youtube,soundcloud}"
      NODELINK_UNIFIEDSEARCHSOURCES: "${NODELINK_SEARCH_SOURCES:-youtube,soundcloud}"
    restart: unless-stopped
    networks: [botnet]

  bot:
    # Yereldeyken derlenir; VPS'te CI'nin ittiği imaj (BOT_IMAGE) çekilir.
    image: ${BOT_IMAGE:-discord-bot:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot
    depends_on: [nodelink]
    env_file: .env
    environment:
      # NodeLink'e compose ağı üzerinden servis adıyla bağlan.
      LAVALINK_HOST: "nodelink"
      LAVALINK_PORT: "4000"
      LAVALINK_PASSWORD: "${NODELINK_PASSWORD:-youshallnotpass}"
      DB_PATH: "/app/data/bot.db"
    volumes:
      # SQLite veritabanı kalıcı olsun (deploy'lar arası silinmez).
      - bot-data:/app/data
    restart: unless-stopped
    networks: [botnet]

  # Web paneli: Caddy statik SPA'yı sunar + /api ve /ws'i bota proxy'ler (otomatik HTTPS).
  # PANEL_DOMAIN .env'de tanımlı olmalı. Panel kullanmıyorsan bu servisi silebilirsin.
  caddy:
    image: ${WEB_IMAGE:-discord-panel:local}
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: caddy
    depends_on: [bot]
    environment:
      PANEL_DOMAIN: "${PANEL_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks: [botnet]

volumes:
  bot-data:
  caddy-data:
  caddy-config:

networks:
  botnet:
    driver: bridge
